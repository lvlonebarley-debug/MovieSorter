name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: unzip MovieSorter.zip
      - name: Make gradlew executable
        run: chmod +x MovieSorter/gradlew
      - name: Build APK
        run: cd MovieSorter && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MovieSorter-APK
          path: MovieSorter/app/build/outputs/apk/debug/app-debug.apk
