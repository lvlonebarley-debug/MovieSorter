name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: unzip MovieSorter.zip
      - name: Find and build
        run: |
          find . -name "gradlew" | head -5
          GRADLEW=$(find . -name "gradlew" | head -1)
          chmod +x $GRADLEW
          cd $(dirname $GRADLEW)
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MovieSorter-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
